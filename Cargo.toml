[package]
name = "caelum-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Caelum: a native workspace terminal for Linux, macOS and Windows, built in Rust. Your space to build."
license = "MIT"
repository = "https://github.com/DakodaStemen/caelum-rs"

[dependencies]
alacritty_terminal = "=0.26.0"
anyhow = "1"
ab_glyph = "0.2"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
tempfile = "3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1.1"
notify = "8"
raw-window-handle = "0.6"
egui_extras = { version = "0.33", default-features = false, features = ["svg", "image"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Linux needs explicit windowing backends; Windows (Win32) and macOS (AppKit) use winit's defaults.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }
# The PRIMARY selection (select to copy, middle-click to paste); egui only has the clipboard.
arboard = { version = "3", default-features = false }
smithay-clipboard = "0.7"

# Non-Linux hosts have no /proc, so the system panel uses sysinfo there.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.14", features = ["xtest"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu"] }

# Packaging via cargo-packager (https://github.com/crabnebula-dev/cargo-packager).
# Release artifacts are built by .github/workflows/release.yml. RPMs use the
# [package.metadata.generate-rpm] table below since cargo-packager has no rpm target.
[package.metadata.packager]
product-name = "Caelum"
identifier = "io.github.DakodaStemen.CaelumRust"
description = "A native workspace terminal built in Rust."
authors = ["DakodaStemen"]
license-file = "LICENSE"
category = "DeveloperTool"
icons = [
  "assets/app-icons/linux/hicolor/16x16/apps/caelum-rs.png",
  "assets/app-icons/linux/hicolor/22x22/apps/caelum-rs.png",
  "assets/app-icons/linux/hicolor/24x24/apps/caelum-rs.png",
  "assets/app-icons/linux/hicolor/32x32/apps/caelum-rs.png",
  "assets/app-icons/linux/hicolor/48x48/apps/caelum-rs.png",
  "assets/app-icons/linux/hicolor/64x64/apps/caelum-rs.png",
  "assets/app-icons/linux/hicolor/128x128/apps/caelum-rs.png",
  "assets/app-icons/linux/hicolor/256x256/apps/caelum-rs.png",
  "assets/app-icons/linux/hicolor/512x512/apps/caelum-rs.png",
  "assets/app-icons/windows/caelum-rs.ico",
  "assets/app-icons/macos/caelum-rs.icns",
]
formats = ["all"]

[package.metadata.packager.deb]
package-name = "caelum-rs"
# Adds StartupWMClass so docks match the window (app_id) to the launcher; shared by AppImage/pacman.
desktop-template = "packaging/caelum-rs.desktop.hbs"

[package.metadata.packager.wix]
# MSI: unsigned unless a signing certificate is configured (see PACKAGING.md).

[package.metadata.packager.dmg]
window-size = { width = 660, height = 400 }

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/caelum-rs", dest = "/usr/bin/caelum-rs", mode = "755" },
  { source = "LICENSE", dest = "/usr/share/licenses/caelum-rs/LICENSE", mode = "644", doc = true },
  { source = "packaging/io.github.DakodaStemen.CaelumRust.desktop", dest = "/usr/share/applications/io.github.DakodaStemen.CaelumRust.desktop", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/16x16/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/16x16/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/22x22/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/22x22/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/24x24/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/24x24/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/32x32/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/32x32/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/48x48/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/48x48/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/64x64/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/64x64/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/128x128/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/128x128/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/256x256/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/256x256/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/512x512/apps/caelum-rs.png", dest = "/usr/share/icons/hicolor/512x512/apps/caelum-rs.png", mode = "644" },
  { source = "assets/app-icons/linux/hicolor/scalable/apps/caelum-rs.svg", dest = "/usr/share/icons/hicolor/scalable/apps/caelum-rs.svg", mode = "644" },
]

# Embeds the application icon in caelum-rs.exe; only compiled when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
