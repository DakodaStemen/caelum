# Caelum configuration: ~/.config/caelum-rs/config.toml
# Edits are applied while Caelum is running. A file that fails to parse is ignored
# (the previous settings stay in effect) and the error is shown in a notification.
# Values set here override the same preferences in the app's JSON profile; the
# profile (workspace.json) still stores layout and state.

# Id of a bundled or imported theme, e.g. "adwaita-dark", "graphite", "starlight".
# Setting it stops following the desktop's light/dark style and accent.
# theme = "graphite"

# Caelum starts your shell with its prompt/cwd integration automatically (bash, zsh,
# fish); no dotfile edits needed. Set to false to start shells untouched.
# shell_integration = true
# Announce a command that finishes after this many seconds while you are in another
# pane, tab or window. 0 turns it off.
# long_command_seconds = 10

[font]
# Fontconfig family name. Leave unset for the system monospace font.
# family = "JetBrains Mono"
# size = 15.0          # 6 to 72
# line_height = 1.2    # 1.0 to 3.0

[cursor]
# style = "block"      # block | bar | underline
# blink = false

[terminal]
# min_contrast = 1.5   # 1 to 21: text fainter than this against its background is
#                      # nudged lighter/darker; 1 turns it off
# osc52_write = true   # let programs set the clipboard with OSC 52 (never read it)

# Shortcuts are "ctrl+shift+key" style and need ctrl or alt. Actions:
#   command_palette toggle_sidebar new_tab split_right split_below split_left
#   split_up balance_panes zoom_pane close_pane open_file save_file search
#   next_tab prev_tab copy paste prev_prompt next_prompt focus_left focus_right
#   focus_up focus_down copy_last_output
[keybindings]
# new_tab = "ctrl+shift+t"
# prev_prompt = "ctrl+shift+up"
# focus_left = "ctrl+alt+left"
